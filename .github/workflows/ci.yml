name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    name: Flutter (analyze + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --line-length 120 --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test

  database:
    name: Supabase (migrations + pgTAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # config.toml sebaiknya di-commit setelah `supabase init` lokal; ini hanya cadangan
      - run: '[ -f supabase/config.toml ] || supabase init'
      - run: supabase db start
      - run: supabase test db
